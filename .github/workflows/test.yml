name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, reuna-builder-x86]
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: ["4.14.2", "5.2.1"]
    steps:
      - uses: actions/checkout@v4

      - name: Are the private prerequisites reachable?
        id: creds
        env:
          TOKEN: ${{ secrets.REUNA_CI_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Build skipped::REUNA_CI_TOKEN is not configured"
          fi

      - name: Let git reach private Reuna repositories
        if: steps.creds.outputs.ok == 'true'
        env:
          TOKEN: ${{ secrets.REUNA_CI_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - uses: ocaml/setup-ocaml@v3
        if: steps.creds.outputs.ok == 'true'
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-local-packages: "*.opam"

      - name: Build the GMP prerequisite without host privileges
        if: steps.creds.outputs.ok == 'true'
        env:
          GMP_VERSION: "6.3.0"
          GMP_SHA256: a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898
        run: |
          archive="$RUNNER_TEMP/gmp-$GMP_VERSION.tar.xz"
          source_dir="$(mktemp --directory "$RUNNER_TEMP/gmp-build.XXXXXX")"
          gmp_prefix="$RUNNER_TEMP/ocaml-cardano-gmp-${{ matrix.ocaml-compiler }}"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --output "$archive" \
            "https://ftp.gnu.org/gnu/gmp/gmp-$GMP_VERSION.tar.xz"
          echo "$GMP_SHA256  $archive" | sha256sum --check --strict
          tar --extract --xz --file "$archive" --directory "$source_dir" \
            --strip-components 1
          cd "$source_dir"
          ./configure --prefix="$gmp_prefix" --with-pic
          make -j"$(nproc)"
          make install
          echo "CPATH=$gmp_prefix/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$gmp_prefix/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$gmp_prefix/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$gmp_prefix/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Pin the private prerequisite wave
        if: steps.creds.outputs.ok == 'true'
        run: |
          M=git+https://github.com/reuna-labs/mirage-crypto.git#v2.4.0-reuna1
          C=git+https://github.com/reuna-labs/ocaml-web3-codec.git#v0.1.0-alpha1
          opam pin add -yn mirage-crypto.dev "$M"
          opam pin add -yn mirage-crypto-ec.dev "$M"
          opam pin add -yn mirage-crypto-blockchain-core.dev "$M"
          opam pin add -yn web3-codec-basen.dev "$C"
          opam pin add -yn web3-codec-base58.dev "$C"
          opam pin add -yn web3-codec-cbor.dev "$C"

      - if: steps.creds.outputs.ok == 'true'
        run: opam install -y --assume-depexts --deps-only --with-test .

      - if: steps.creds.outputs.ok == 'true'
        run: opam exec -- dune build @install

      - if: steps.creds.outputs.ok == 'true'
        run: opam exec -- dune runtest

      - name: Keep the offline package boundary intact
        if: steps.creds.outputs.ok == 'true'
        run: opam exec -- ./test/no_io_guard.sh

      - name: Formatting
        if: steps.creds.outputs.ok == 'true'
        run: opam exec -- dune build @fmt
